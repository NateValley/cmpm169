<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" type="text/css" href="./css/style.css">
    <meta charset="utf-8" />
    
    <!-- MapBox GL JS API-->
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    
    <style>
      #mapbox { width: 100vw; height: 100vh; }
    </style>
    
	<!-- FireBase API -->
	<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
	<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

  </head>
  <body>
    <div id="container">
		
		<!-- Spotify UI -->
		 <div id="spotify-ui">
			
			<h1>BeatPass Lite</h1>
			<img src="./img/full-logo-spotify.svg" width="100" height="100">
			
			<button id="login-button">Login with Spotify</button>
			
			<div id="user-info" style="display: none">
				<img id="profile-pic" alt="Profile Picture" width="150" height="150">
				<p>What's up, <span id="username"></span>?</p>
			</div>

			<div id="recent-tracks" style="display: none">
				<img id="most-recent-pic" alt="Recent Track Picture" width="150" height="150">
				<p>Your most recently played track was: <span id="most-recent"></span></p>
			
				<button id="log-track-button">Log this track into <span class="user-city"></span></button>
			</div>
			
			<div id="city-ui">

				<h2>Recent Tracks in <span class="user-city"></span></h2>
				<button id="refresh-city-button">Refresh</button>

				<ul id="city-tracks"></ul>
	
			</div>

		 </div>

		 <!-- Mapbox -->

		  <div id="mapbox"></div>
	</div>
    
	<script src="./js/spotify-api.js"></script>
	<script src="./js/spotify.js"></script>
    <script src="./js/mapbox.js"></script>
	<script type="module" src="./js/firebase.js"></script>
  </body>
</html>
